<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Poster Admin</title>
    <meta name="description" content="Admin dashboard for generating and publishing LinkedIn posts across multiple engineering categories.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=3.1">
</head>

<body>
    <div class="background-blobs">
        <div class="blob magenta"></div>
        <div class="blob blue"></div>
        <div class="blob purple"></div>
    </div>

    <div class="glass-container">
        <header>
            <div class="header-top">
                <h1>AI Poster <span class="highlight">Admin</span></h1>
            </div>

            <!-- Stats Bar -->
            <div id="stats-bar" class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="stat-total">—</span>
                    <span class="stat-label">Total Posts</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-categories">—</span>
                    <span class="stat-label">Categories Used</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="stat-last-posted">—</span>
                    <span class="stat-label">Last Posted</span>
                </div>
            </div>

            <div class="header-controls">
                <!-- Category Dropdown -->
                <div class="control-group">
                    <label class="control-label" for="topic-select">Category</label>
                    <div class="select-wrapper" id="select-wrapper">
                        <span class="select-icon" id="select-icon">🤖</span>
                        <select id="topic-select" class="glass-select">
                            <option value="ai">Trending Tech &amp; AI</option>
                        </select>
                        <span class="select-chevron">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </span>
                    </div>
                </div>

                <!-- Draft Button -->
                <div class="control-group">
                    <label class="control-label">&nbsp;</label>
                    <button id="draft-btn" class="glass-btn primary-btn">
                        <span class="icon">✨</span> Draft New Options
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Draft Section -->
            <section id="draft-section" class="panel hidden">
                <div class="section-header">
                    <div>
                        <h2>Review Draft Options</h2>
                        <div id="draft-meta" class="draft-meta"></div>
                    </div>
                    <div class="section-actions">
                        <button id="preview-toggle" onclick="togglePreview()" class="glass-btn preview-toggle-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            LinkedIn Preview
                        </button>
                        <button onclick="discardDrafts()" class="glass-btn danger-btn">🗑️ Discard All</button>
                    </div>
                </div>
                <div id="drafts-container" class="draft-grid"></div>
            </section>

            <section class="panel history-panel">
                <h2>Recent Posts</h2>
                <div id="history-container" class="history-list"></div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js?v=3.1"></script>
</body>

</html>
